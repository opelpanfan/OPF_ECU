# Auto-build rusEFI firmware for every STM32F407 OPF board in config/.
# Build logic lives in scripts/rusefi/build_rusefi.sh (same script for local builds).
# Release tag: rusefi-<ref>-<variant>. Release assets use the same prefix
# (rusefi-<ref>-<variant>.bin, .ini, -base.msq, -manual.md, .build-info.txt, ...).
# Board-branch copies under rusefi/ keep the short names (rusefi_firmware.bin, ...).
# Triggers: a v* tag push, or workflow_dispatch. A tag push (event name "push")
# builds every board and publishes releases that do not exist yet (not a dry run).
# workflow_dispatch publishes only when dry_run=false. Never overwrites an existing
# release. Never steals the repo-wide Latest badge (--latest=false).
name: rusEFI autobuild

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'rusEFI tag/branch/sha, "latest", "latest-nightly", or a pinned commit'
        required: false
        default: df128dec524d820bb767bcc503d8561ef01e258c
      variant:
        description: 'Board variant (config/<variant>/), comma list, or "all" (STM32F407 only; no Teensy, no opf33_fome)'
        required: false
        default: all
      dry_run:
        description: "Build + upload artifacts only: no GitHub release, no commit to the board branch (planned diff is printed)"
        type: boolean
        required: false
        default: true
      force:
        description: "Build even if release rusefi-<tag>-<variant> already exists (never overwrites it)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: rusefi-${{ github.ref }}-${{ github.event.inputs.variant || 'all' }}
  cancel-in-progress: false

env:
  TOOLCHAIN_DIR: ${{ github.workspace }}/../toolchain
  TOOLCHAIN_KEY: arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi-62a63b98

jobs:
  plan:
    name: Resolve rusEFI ref / compare with last build
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      matrix: ${{ steps.r.outputs.matrix }}
      any: ${{ steps.r.outputs.any }}
      publish: ${{ steps.r.outputs.publish }}
      prerelease: ${{ steps.r.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/rusefi
            scripts/ci
            config
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          IN_REF: ${{ github.event.inputs.ref }}
          IN_VARIANT: ${{ github.event.inputs.variant }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          DEFAULT_REF="df128dec524d820bb767bcc503d8561ef01e258c"
          ref="${IN_REF:-$DEFAULT_REF}"
          ref=$(scripts/rusefi/build_rusefi.sh --resolve-only --ref "$ref")
          safe=$(printf '%s' "$ref" | tr -c 'A-Za-z0-9._-' '-')

          publish=false
          # Tag pushes arrive as event "push" (this workflow has no branch trigger).
          case "$EVENT" in
            push) publish=true ;;
            workflow_dispatch) [ "$IN_DRY_RUN" = false ] && publish=true ;;
          esac

          if upstream=$(gh api "repos/rusefi/rusefi/releases/tags/$ref" --jq .prerelease 2>/dev/null); then
            prerelease=$upstream
          else
            prerelease=true   # not an upstream release (branch/sha)
          fi

          python3 scripts/ci/list_boards.py --summary >> "$GITHUB_STEP_SUMMARY"
          all=$(python3 scripts/ci/list_boards.py | tr "\n" " ")

          if [ "$EVENT" = workflow_dispatch ]; then
            variants="${IN_VARIANT:-all}"; [ "$variants" = all ] && variants="$all"
          else
            variants="$all"
          fi

          todo=()
          for v in ${variants//,/ }; do
            case "$v" in *teensy*|*Teensy*|*TEENSY*|opf33_fome)
              echo "::warning::skipping variant $v"; continue ;;
            esac
            if [ ! -f "config/$v/board.mk" ] && [ ! -f "scripts/rusefi/board-overlay/$v/board.mk" ]; then
              echo "::error::unknown variant $v (no config/$v/board.mk)"; exit 1
            fi
            rtag="rusefi-${safe}-${v}"
            if gh release view "$rtag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exists=true; else exists=false; fi
            build=true
            case "$EVENT" in
              workflow_dispatch) [ "$exists" = true ] && [ "$IN_FORCE" != true ] && build=false ;;
              *) ;;  # v* tag push: build every board; the release step skips ones that exist
            esac
            echo "$v: release $rtag exists=$exists -> build=$build"
            echo "- \`$v\`: release \`$rtag\` exists=$exists -> build=$build" >> "$GITHUB_STEP_SUMMARY"
            [ "$build" = true ] && todo+=("$v")
          done
          matrix=$(printf '%s\n' "${todo[@]+"${todo[@]}"}" | jq -R . | jq -sc 'map(select(length>0))')
          {
            echo "ref=$ref"; echo "matrix=$matrix"
            echo "any=$([ "$matrix" != "[]" ] && echo true || echo false)"
            echo "publish=$publish"; echo "prerelease=$prerelease"
          } | tee -a "$GITHUB_OUTPUT"
          echo "### rusEFI \`$ref\` ($EVENT): variants \`$matrix\`, publish=$publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build rusefi-${{ needs.plan.outputs.ref }}-${{ matrix.variant }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # only used when publish=true (release + commit to the board branch)
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make zip 7zip mtools dosfstools xxd gcc-multilib g++-multilib rsync

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache ARM toolchain (pinned 14.2.rel1)
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: ${{ env.TOOLCHAIN_KEY }}

      - name: Checkout board branch ${{ matrix.variant }}
        id: br
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant }}
          path: publish-target
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Build firmware (+ publish to rusefi/ of the board branch, or print the planned diff)
        id: b
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF: ${{ needs.plan.outputs.ref }}
          VARIANT: ${{ matrix.variant }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          HAS_BRANCH: ${{ steps.br.outcome == 'success' && 'true' || 'false' }}
        run: |
          set -o pipefail
          pub=()
          if [ "$HAS_BRANCH" = true ]; then
            pub=(--publish-branch "$VARIANT" --publish-dir "$GITHUB_WORKSPACE/publish-target")
            [ "$PUBLISH" = true ] || pub+=(--publish-dry-run)
          else
            echo "::warning::board branch $VARIANT does not exist - firmware will be built, nothing committed"
          fi
          scripts/rusefi/build_rusefi.sh --ref "$REF" --variant "$VARIANT" \
            --work "$RUNNER_TEMP/rusefi-build" --out "$GITHUB_WORKSPACE/out" \
            --toolchain-dir "$TOOLCHAIN_DIR" "${pub[@]}" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'; }
          echo "::error title=build errors::$(grep -nE 'ERROR|[Ee]rror[: ]|FAILED|No such file' "$log" | tail -25 | cut -c1-300 | enc)"
          echo "::error title=build log tail::$(tail -40 "$log" | cut -c1-300 | enc)"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rusefi-build-log-${{ matrix.variant }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Summary
        env:
          SIG: ${{ steps.b.outputs.signature }}
          SHA: ${{ steps.b.outputs.rusefi_commit }}
          PUB: ${{ steps.b.outputs.published_sha }}
        run: |
          {
            echo "rusEFI commit: \`$SHA\`  signature: \`$SIG\`  board-branch commit: \`${PUB:-none (dry run)}\`"
            echo '```'; sed -n '/^=== Publishing/,/^=== DONE/p' "$RUNNER_TEMP/build.log"; echo '```'
            echo '```'; cat out/SHA256SUMS; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rusefi-${{ needs.plan.outputs.ref }}-${{ matrix.variant }}
          path: out/
          if-no-files-found: error

      - name: Publish GitHub release rusefi-${{ needs.plan.outputs.ref }}-${{ matrix.variant }}
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.plan.outputs.ref }}
          VARIANT: ${{ matrix.variant }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          SIG: ${{ steps.b.outputs.signature }}
          SHA: ${{ steps.b.outputs.rusefi_commit }}
        run: |
          set -euo pipefail
          safe=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9._-' '-')
          TAG="rusefi-${safe}-${VARIANT}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists, not overwriting"; exit 0; fi
          {
            echo "rusEFI firmware for \`$VARIANT\`, built from rusefi/rusefi \`$REF\` (\`$SHA\`)."
            echo
            echo "TunerStudio signature: \`$SIG\`"
            echo
            echo "Release assets share this tag prefix (\`$TAG.bin\`, \`$TAG.ini\`, \`$TAG-base.msq\`, ...). Flash the \`.dfu\` or \`.bin\` via STM32 DFU (0483:df11). Load \`$TAG.ini\` in TunerStudio."
            echo
            echo '```'; cat out/SHA256SUMS; echo '```'
          } > notes.md
          pre=(--latest=false)
          [ "$PRERELEASE" = true ] && pre+=(--prerelease)
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md "${pre[@]}" out/*

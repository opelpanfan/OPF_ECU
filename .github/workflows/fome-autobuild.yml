# Auto-build FOME firmware for every STM32F407 OPF board in config/.
# The board matrix is generated by scripts/ci/list_boards.py (a new config/<board>
# folder is picked up with no workflow edit). opf33 uses config/opf33_fome/ as its
# overlay; opf33_fome itself is not a second board.
# Release tag: fome-<ref>-<variant>. Release assets use the same prefix
# (fome-<ref>-<variant>.bin, .ini, -base.msq, .update.srec, .bl.srec, ...).
# Board-branch copies under fome/ keep the short names (fome.bin, ...).
# Triggers: a v* tag push, or workflow_dispatch. A tag push (event name "push")
# builds every board and publishes releases that do not exist yet (not a dry run).
# workflow_dispatch publishes only when dry_run=false. Never overwrites an existing
# release. Never steals the repo-wide Latest badge (--latest=false).
name: FOME autobuild

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'FOME tag/branch/sha, "latest", or a pinned commit'
        required: false
        default: 3b772a890ae0703793b14f08822c20f34b386b8c
      variant:
        description: 'Board variant (config/<variant>/), comma list, or "all" (STM32F407 only; no Teensy)'
        required: false
        default: all
      dry_run:
        description: "Build + upload artifacts only (no release, no commit to the board branch)"
        type: boolean
        required: false
        default: true
      force:
        description: "Build/publish even if release fome-<tag>-<variant> exists (never overwrites the release)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: fome-${{ github.ref }}-${{ github.event.inputs.variant || 'all' }}
  cancel-in-progress: false

env:
  TOOLCHAIN_DIR: ${{ github.workspace }}/../toolchain

jobs:
  plan:
    name: Resolve FOME ref / compare with last build
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      commit: ${{ steps.r.outputs.commit }}
      matrix: ${{ steps.r.outputs.matrix }}
      any: ${{ steps.r.outputs.any }}
      publish: ${{ steps.r.outputs.publish }}
      toolchain: ${{ steps.r.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/fome
            scripts/ci
            config
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          IN_REF: ${{ github.event.inputs.ref }}
          IN_VARIANT: ${{ github.event.inputs.variant }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          DEFAULT_REF="3b772a890ae0703793b14f08822c20f34b386b8c"
          ref=$(scripts/fome/build_fome.sh --resolve-only --ref "${IN_REF:-$DEFAULT_REF}")
          safe=$(printf '%s' "$ref" | tr -c 'A-Za-z0-9._-' '-')
          commit=$(gh api "repos/FOME-Tech/fome-fw/commits/$ref" --jq .sha)
          toolchain=$(curl -fsSL "https://raw.githubusercontent.com/FOME-Tech/fome-fw/$ref/firmware/use_arm_gcc.mk" \
            | grep -oE 'arm-gnu-toolchain-[^ ]*-x86_64-arm-none-eabi' | grep -v darwin | head -1 || true)

          publish=false
          # Tag pushes arrive as event "push" (this workflow has no branch trigger).
          case "$EVENT" in
            push) publish=true ;;
            workflow_dispatch) [ "$IN_DRY_RUN" = false ] && publish=true ;;
          esac

          python3 scripts/ci/list_boards.py --summary >> "$GITHUB_STEP_SUMMARY"
          all=$(python3 scripts/ci/list_boards.py | tr "\n" " ")

          if [ "$EVENT" = workflow_dispatch ]; then
            variants="${IN_VARIANT:-all}"; [ "$variants" = all ] && variants="$all"
          else
            variants="$all"
          fi

          todo=()
          for v in ${variants//,/ }; do
            overlay=$(python3 scripts/ci/list_boards.py --fome-overlay "$v")
            if [ ! -f "$overlay/board.mk" ] && [ ! -f "scripts/fome/board-overlay/$v/board.mk" ]; then
              echo "::error::$v: missing $overlay/board.mk — port the FOME config"; exit 1
            fi
            rtag="fome-${safe}-${v}"
            if gh release view "$rtag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then rel=true; else rel=false; fi
            build=true
            case "$EVENT" in
              workflow_dispatch) [ "$rel" = true ] && [ "$IN_FORCE" != true ] && build=false ;;
              *) ;;  # v* tag push: build every board; the release step skips ones that exist
            esac
            echo "$v: overlay=$overlay release $rtag exists=$rel -> build=$build"
            echo "- \`$v\`: overlay \`$overlay\`, release \`$rtag\` exists=$rel -> build=$build" >> "$GITHUB_STEP_SUMMARY"
            [ "$build" = true ] && todo+=("$v")
          done
          matrix=$(printf '%s\n' "${todo[@]+"${todo[@]}"}" | jq -R . | jq -sc 'map(select(length>0))')
          {
            echo "ref=$ref"; echo "commit=$commit"; echo "matrix=$matrix"
            echo "any=$([ "$matrix" != "[]" ] && echo true || echo false)"
            echo "publish=$publish"; echo "toolchain=${toolchain:-unknown}"
          } | tee -a "$GITHUB_OUTPUT"
          echo "### FOME \`$ref\` (\`${commit:0:10}\`) ($EVENT): variants \`$matrix\`, publish=$publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build fome-${{ needs.plan.outputs.ref }}-${{ matrix.variant }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends make zip mtools dosfstools xxd gcc-multilib g++-multilib rsync

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ needs.plan.outputs.ref }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache ARM toolchain (pinned by FOME's use_arm_gcc.mk, sha256-checked)
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: ${{ needs.plan.outputs.toolchain }}-x86_64

      - name: Build firmware + base tune
        id: b
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF: ${{ needs.plan.outputs.ref }}
          VARIANT: ${{ matrix.variant }}
          TOOLCHAIN_CACHE: ${{ env.TOOLCHAIN_DIR }}
          REPRO_DEBUG: "1"
        run: |
          set -o pipefail
          scripts/fome/build_fome.sh --ref "$REF" --variant "$VARIANT" \
            --work "$RUNNER_TEMP/fome-build" --out "$GITHUB_WORKSPACE/out" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'; }
          echo "::error title=build errors::$(grep -nE 'ERROR|[Ee]rror[: ]|FAILED|No such file' "$log" | tail -25 | cut -c1-300 | enc)"
          echo "::error title=build log tail::$(tail -40 "$log" | cut -c1-300 | enc)"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fome-build-log-${{ matrix.variant }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Summary
        run: |
          { echo '```'; cat out/build-info.txt; echo; cat out/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fome-${{ needs.plan.outputs.ref }}-${{ matrix.variant }}
          path: out/
          if-no-files-found: error

      - name: Check out board branch ${{ matrix.variant }}
        id: br
        if: needs.plan.outputs.publish == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant }}
          path: board-branch
          fetch-depth: 20

      - name: Commit firmware to ${{ matrix.variant }}/fome
        if: needs.plan.outputs.publish == 'true' && steps.br.outcome == 'success'
        env:
          REF: ${{ needs.plan.outputs.ref }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          cd board-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          "$GITHUB_WORKSPACE/scripts/fome/stage_board_branch.sh" "$GITHUB_WORKSPACE/out" . --push \
            "FOME $REF (${COMMIT:0:10}) for $VARIANT - $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish GitHub release fome-${{ needs.plan.outputs.ref }}-${{ matrix.variant }}
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.plan.outputs.ref }}
          VARIANT: ${{ matrix.variant }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          safe=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9._-' '-')
          TAG="fome-${safe}-${VARIANT}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists, not overwriting"; exit 0; fi
          STAGE="$RUNNER_TEMP/release-assets"
          scripts/ci/stage_release_assets.sh "$TAG" out "$STAGE"
          {
            echo "FOME firmware for \`$VARIANT\`, built from FOME-Tech/fome-fw \`$REF\` (\`${COMMIT:0:10}\`)."
            echo
            echo "Release assets share this tag prefix (\`$TAG.bin\`, \`$TAG.ini\`, \`$TAG-base.msq\`, \`$TAG.update.srec\`, \`$TAG.bl.srec\`, ...)."
            echo "First install: flash \`$TAG.bin\` at 0x08000000 via STM32 DFU (0483:df11). Later updates: \`$TAG.update.srec\` through OpenBLT."
            echo "Load \`$TAG.ini\` in TunerStudio."
            echo
            echo '```'; cat "$STAGE/SHA256SUMS"; echo '```'
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --latest=false --notes-file notes.md "$STAGE"/*

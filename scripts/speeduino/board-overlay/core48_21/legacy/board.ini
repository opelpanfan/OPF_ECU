; Speeduino CORE48_21 Project Configuration File

[env:CORE8]
platform = ststm32
;platform = https://github.com/platformio/platform-ststm32.git
framework = arduino
board = black_f407zg
lib_deps = stm32duino/STM32duino RTC, greiman/SdFat
board_build.core = stm32
build_flags =  
    -w
    -std=gnu++11 
    -UBOARD_MAX_IO_PINS 
    -DENABLE_HWSERIAL2 
    -DENABLE_HWSERIAL3 
    -DUSBCON 
    -DHAL_PCD_MODULE_ENABLED 
    -DUSBD_USE_CDC 
    -DHAL_CAN_MODULE_ENABLED 
;-------CORE8 SETTINGS
    -DUSE_STM
    -DUSE_LPS22
    ;-DUSE_LPS25

    -DUNUSED_PIN=PB2

    -DUSE_SPI_EEPROM
    -DCONFIG_SPI_SS=PA15
    -DCONFIG_SPI_MOSI=PB15
    -DCONFIG_SPI_MISO=PB14
    -DCONFIG_SPI_SCK=PB13

    -DPIN_WIRE_SDA=PB11
    -DPIN_WIRE_SCL=PB10
    -DPIN_SERIAL_RX=PA10
    -DPIN_SERIAL_TX=PA9    
    ;-DPWM_FAN_AVAILABLE
    -DUSE_I2C_BARO
    
;-------CORE8 DASH SETTINGS
    -DUSE_CAN_1
    -DUSE_CAN_2
    ;-DUSE_CAN_DASH=0
    ;-DUSE_DASH_LINK
    ;-DUSE_DASH_AIM

;-------PIN Config - GENERAL
    -DLED_RUNNING=PG10
    -DLED_WARNING=PG11
    -DLED_ALERT=PG12
    -DLED_COMS=PG13

;-------PIN Config - TRIGGER
    -DPIN_TRIGGER_1=PE2
    -DPIN_TRIGGER_2=PE3
    ;-DPIN_TRIGGER_3=PE4
    ;-DPIN_TRIGGER_VSS=PE5

;-------PIN Config - INJ
    -DPIN_INJECTOR_1=PD6
    -DPIN_INJECTOR_2=PD7
    -DPIN_INJECTOR_3=PD8
    -DPIN_INJECTOR_4=PD9
    -DPIN_INJECTOR_5=PD10
    -DPIN_INJECTOR_6=PD11
    -DPIN_INJECTOR_7=PD12
    -DPIN_INJECTOR_8=PD13

;-------PIN Config - COIL
    -DPIN_COIL_1=PG15
    -DPIN_COIL_2=PG8
    -DPIN_COIL_3=PE10
    -DPIN_COIL_4=PE11
    -DPIN_COIL_5=PE12
    -DPIN_COIL_6=PE13
    -DPIN_COIL_7=PE14
    -DPIN_COIL_8=PE15

;-------PIN Config - ANALOG
    -DPIN_BAT=PB1
    -DPIN_CLT=PB0
    -DPIN_IAT=PA7
    -DPIN_TPS=PC5
    -DPIN_O2=PC3
    -DPIN_O2_2=PA0
    ;-DPIN_BARO=PC5
    -DPIN_MAP=PA2
    -DPIN_OILPRESSURE=PC4
    -DPIN_SPARETEMP1=PA6
    -DPIN_SPARETEMP=PA3
    -DPIN_FUELPRESSURE=PA5

;-------PIN Config - OTHER
    -DPIN_TACH=PD14
    -DPIN_IDLE_1=PG6
    ;-DPIN_IDLE_2=PG2
    -DPIN_BOOST=PG5
    -DPIN_FUELPUMP=PG3
    -DPIN_FAN=PG4
    -DPIN_VVTI_1=PG7
    ;-DPIN_LAUNCH=PF5
    ;-DPIN_STEPPERDIR=PG4
    ;-DPIN_STEPPERSTEP=PG5
    ;-DPIN_FUEL2=PF4
    ;-DPIN_SPARK2=PF4

upload_protocol = dfu
debug_tool = stlink
monitor_speed = 115200

[platformio]
src_dir=speeduino
default_envs = CORE8

